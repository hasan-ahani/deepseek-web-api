# =============================================================================
# Build & Push DeepSeek Web API Image
# =============================================================================
#
# OpenAI-compatible bridge that automates chat.deepseek.com.
# Consumed by the WeUi Laravel app (docker/production) as `deepseek-web`.
#
# Triggers:
#   - Push to main/master   → :latest + :<branch> + :sha-<short>
#   - Push v*.*.* tag       → :v1.2.3 + :1.2.3 + :1.2 + :1 + :sha-<short>
#   - Manual workflow dispatch
#
# Publishes a multi-arch (linux/amd64 + linux/arm64) image to both GHCR and
# Docker Hub. The deployment stack pulls the Docker Hub image:
#   hassanahani/deepseek-web-api:latest
#
# Each architecture is built natively (no QEMU emulation) on its own runner,
# then the per-arch manifests are merged into a single multi-arch tag. This
# keeps the bundled Chromium build fast and reliable while letting the image
# run on both x86_64 VPS hosts and Apple Silicon (arm64) dev machines.
# =============================================================================

name: Build DeepSeek Web API Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-deepseek-web-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hasan-ahani/deepseek-web-api
  DOCKERHUB_REPO: hassanahani/deepseek-web-api

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------
  # Build each platform natively, push by digest
  # ----------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # ----------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # Authenticate with GitHub Container Registry
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Authenticate with Docker Hub
      # ----------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Extract Docker metadata (tags + labels)
      # ----------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            # Default branch / version tag → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            # Keep branch tag for normal branch builds
            type=ref,event=branch
            # On tag push → v1.2.3
            type=ref,event=tag
            # On tag push → semver tags (1.2.3, 1.2, 1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Every push → :sha-<short>
            type=sha,prefix=,format=short

      # ----------------------------------------------------------------
      # Build per-platform image and push by digest (no tag yet). The
      # merge job assembles the multi-arch tags from these digests.
      # ----------------------------------------------------------------
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # On PRs just build (cacheonly) to validate both arches; on real
          # pushes export to the registry by digest for the merge job.
          outputs: ${{ github.event_name != 'pull_request' && 'type=image,name-canonical=true,push=true' || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Attestations turn each per-arch digest into an index instead of a
          # plain manifest, which breaks `imagetools create` in the merge job.
          # Keep them off so the per-arch digests are mergeable image manifests.
          provenance: false
          sbom: false

      # ----------------------------------------------------------------
      # Export the platform digest for the merge job
      # ----------------------------------------------------------------
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------------
  # Merge the per-arch images into multi-arch tags
  # ----------------------------------------------------------------
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,format=short

      - name: Create manifest lists and push
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          ghcr_tags=$(jq -cr --arg p "${{ env.REGISTRY }}/" '[.tags[] | select(startswith($p))] | map("-t " + .) | join(" ")' <<< "$META_JSON")
          hub_tags=$(jq -cr --arg p "${{ env.DOCKERHUB_REPO }}" '[.tags[] | select(startswith($p))] | map("-t " + .) | join(" ")' <<< "$META_JSON")

          echo "GHCR tags: $ghcr_tags"
          echo "Docker Hub tags: $hub_tags"

          docker buildx imagetools create $ghcr_tags \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

          docker buildx imagetools create $hub_tags \
            $(printf '${{ env.DOCKERHUB_REPO }}@sha256:%s ' *)

      # ----------------------------------------------------------------
      # Generate build summary
      # ----------------------------------------------------------------
      - name: Generate build summary
        run: |
          echo "## 🐳 DeepSeek Web API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` + \`${{ env.DOCKERHUB_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
