# =============================================================================
# Build & Push DeepSeek Web API Image
# =============================================================================
#
# OpenAI-compatible bridge that automates chat.deepseek.com.
# Consumed by the WeUi Laravel app (docker/production) as `deepseek-web`.
#
# Triggers:
#   - Push to main/master   → :latest + :<branch> + :sha-<short>
#   - Push v*.*.* tag       → :v1.2.3 + :1.2.3 + :1.2 + :1 + :sha-<short>
#   - Pull request          → build only (no push)
#   - Manual workflow dispatch
#
# Publishes a multi-arch (linux/amd64 + linux/arm64) image to both GHCR and
# Docker Hub. arm64 is built via QEMU emulation so the resulting manifest list
# runs on both x86_64 VPS hosts and Apple Silicon (arm64) machines — without it
# Docker on Mac fails with "no matching manifest for linux/arm64/v8".
#
# The deployment stack pulls the Docker Hub image:
#   hassanahani/deepseek-web-api:latest
# =============================================================================

name: Build DeepSeek Web API Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-deepseek-web-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hasan-ahani/deepseek-web-api
  DOCKERHUB_REPO: hassanahani/deepseek-web-api

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # QEMU for multi-platform builds (arm64 emulation)
      # ----------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ----------------------------------------------------------------
      # Docker Buildx
      # ----------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------
      # Authenticate with GitHub Container Registry
      # ----------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Authenticate with Docker Hub
      # ----------------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Extract Docker metadata (tags + labels)
      # ----------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            # Default branch / version tag → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            # Keep branch tag for normal branch builds
            type=ref,event=branch
            # On tag push → v1.2.3
            type=ref,event=tag
            # On tag push → semver tags (1.2.3, 1.2, 1)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Every push → :sha-<short>
            type=sha,prefix=,format=short

      # ----------------------------------------------------------------
      # Build and push multi-arch image (amd64 + arm64 via QEMU)
      # ----------------------------------------------------------------
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ----------------------------------------------------------------
      # Generate build summary
      # ----------------------------------------------------------------
      - name: Generate build summary
        run: |
          echo "## 🐳 DeepSeek Web API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build-and-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | \`linux/amd64, linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` + \`${{ env.DOCKERHUB_REPO }}\` |" >> $GITHUB_STEP_SUMMARY
